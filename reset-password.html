<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Reset your Northstar Academy password." />
    <meta name="theme-color" content="#f7f7f2" />
    <title>Reset Password — Northstar Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="bg-paper text-ink antialiased">
    <main class="mx-auto flex min-h-screen max-w-4xl items-center px-5 py-16 sm:px-8 lg:px-10">
      <div class="mx-auto w-full max-w-lg rounded-[2rem] border border-ink/10 bg-white p-6 shadow-soft sm:p-8">
        <div class="flex items-center justify-between gap-3">
          <div>
            <p class="text-xs font-bold uppercase tracking-[0.18em] text-forest">Reset password</p>
            <h1 class="font-display mt-2 text-3xl font-extrabold tracking-[-0.05em]">Set a new password</h1>
          </div>
          <a href="/index.html" class="inline-flex h-10 w-10 items-center justify-center rounded-full bg-[#edf6df] text-lg text-forest" aria-label="Back to home">✦</a>
        </div>

        <p class="mt-5 text-sm leading-6 text-muted">
          Enter the email associated with your Northstar account and we’ll send instructions to reset your password.
        </p>

        <form class="mt-7 space-y-5" data-demo-form data-success-message="Password reset instructions have been sent to your inbox.">
          <label class="block text-sm font-semibold text-ink">
            Email address
            <input class="mt-2 block w-full rounded-2xl border border-ink/10 bg-paper px-4 py-3.5 text-sm text-ink outline-none transition focus:border-forest" type="email" name="email" placeholder="you@example.com" required />
          </label>

          <button type="submit" class="inline-flex w-full items-center justify-center rounded-full bg-forest px-5 py-3.5 text-sm font-bold text-white transition hover:bg-ink">Send reset link</button>
          <p data-form-message class="min-h-4 text-sm text-forest" aria-live="polite"></p>
        </form>

        <p class="mt-6 text-center text-sm text-muted">
          Remembered it?
          <a href="/login.html" class="font-semibold text-forest hover:text-ink">Back to login</a>
        </p>
      </div>
    </main>
  </body>
</html>
