<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Shopping cart for Northstar Academy." />
    <meta name="theme-color" content="#f7f7f2" />
    <title>Cart — Northstar Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="bg-paper text-ink antialiased">
    <main>
      <section class="mx-auto max-w-7xl px-5 py-16 sm:px-8 lg:px-10">
        <div class="reveal mb-8">
          <p class="text-xs font-bold uppercase tracking-[.2em] text-forest">Your cart</p>
          <h1 class="font-display mt-3 text-4xl font-extrabold tracking-[-.05em]">Ready to check out.</h1>
        </div>

        <div class="grid gap-8 lg:grid-cols-[1.3fr_0.7fr]">
          <div class="space-y-5">
            <div class="reveal flex flex-col gap-4 rounded-[1.75rem] border border-ink/10 bg-white p-5 shadow-soft sm:flex-row sm:items-center">
              <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=800&q=80" alt="Portfolio Kit" class="h-28 w-full rounded-[1.25rem] object-cover sm:w-28" />
              <div class="flex-1">
                <h2 class="font-display text-2xl font-extrabold">Portfolio Kit</h2>
                <p class="mt-1 text-sm text-muted">Editable planning templates</p>
              </div>
              <div class="flex items-center gap-4">
                <span class="font-display text-xl font-extrabold">$29</span>
                <button class="rounded-full border border-ink/10 px-3 py-2 text-sm font-semibold">Remove</button>
              </div>
            </div>

            <div class="reveal flex flex-col gap-4 rounded-[1.75rem] border border-ink/10 bg-white p-5 shadow-soft sm:flex-row sm:items-center">
              <img src="https://images.unsplash.com/photo-1455390582262-044cdead277a?auto=format&fit=crop&w=800&q=80" alt="Study Planner" class="h-28 w-full rounded-[1.25rem] object-cover sm:w-28" />
              <div class="flex-1">
                <h2 class="font-display text-2xl font-extrabold">Study Planner</h2>
                <p class="mt-1 text-sm text-muted">Daily learning system</p>
              </div>
              <div class="flex items-center gap-4">
                <span class="font-display text-xl font-extrabold">$19</span>
                <button class="rounded-full border border-ink/10 px-3 py-2 text-sm font-semibold">Remove</button>
              </div>
            </div>
          </div>

          <aside class="reveal rounded-[1.75rem] border border-ink/10 bg-white p-6 shadow-soft">
            <p class="text-xs font-bold uppercase tracking-[.2em] text-forest">Summary</p>
            <div class="mt-5 space-y-3 text-sm text-muted">
              <div class="flex items-center justify-between"><span>Subtotal</span><span class="font-semibold text-ink">$48</span></div>
              <div class="flex items-center justify-between"><span>Shipping</span><span class="font-semibold text-ink">Free</span></div>
              <div class="flex items-center justify-between"><span>Tax</span><span class="font-semibold text-ink">$3.84</span></div>
            </div>
            <div class="mt-5 border-t border-ink/5 pt-5">
              <div class="flex items-center justify-between"><span class="font-semibold text-ink">Total</span><span class="font-display text-3xl font-extrabold">$51.84</span></div>
              <a href="/checkout.html" class="mt-6 block rounded-full bg-forest px-5 py-3 text-center text-sm font-bold text-white transition hover:bg-ink">Checkout</a>
            </div>
          </aside>
        </div>
      </section>
    </main>
  </body>
</html>
