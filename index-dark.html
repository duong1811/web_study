<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dark theme homepage concept for Northstar Academy." />
    <meta name="theme-color" content="#0d1723" />
    <title>Dark Home — Northstar Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="bg-[#0d1723] text-white antialiased">
    <main>
      <section class="mx-auto max-w-7xl px-5 py-20 sm:px-8 lg:px-10">
        <div class="reveal grid gap-10 lg:grid-cols-[1fr_0.9fr] lg:items-center">
          <div>
            <p class="text-xs font-bold uppercase tracking-[.2em] text-[#a7d6ff]">Learn for what's next</p>
            <h1 class="font-display mt-5 text-5xl font-extrabold leading-[0.96] tracking-[-.06em] sm:text-6xl">Turn curiosity into momentum.</h1>
            <p class="mt-5 max-w-xl text-base leading-7 text-slate-300">Build practical skills with expert guidance, real projects, and a community that keeps you accountable.</p>
            <div class="mt-8 flex flex-col gap-3 sm:flex-row">
              <a href="/courses.html" class="inline-flex items-center justify-center rounded-full bg-[#a7d6ff] px-6 py-3.5 text-sm font-bold text-[#0d1723]">Explore courses</a>
              <a href="/about.html" class="inline-flex items-center justify-center rounded-full border border-white/15 px-6 py-3.5 text-sm font-bold text-white">Learn more</a>
            </div>
          </div>
          <div class="overflow-hidden rounded-[2rem] border border-white/10 bg-[#122233] p-3 shadow-2xl">
            <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1200&q=80" alt="Students collaborating" class="h-[30rem] w-full rounded-[1.5rem] object-cover" />
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
