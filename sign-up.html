<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create your Northstar Academy account." />
    <meta name="theme-color" content="#f7f7f2" />
    <title>Sign Up — Northstar Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="bg-paper text-ink antialiased">
    <main class="mx-auto flex min-h-screen max-w-6xl items-center px-5 py-16 sm:px-8 lg:px-10">
      <div class="grid w-full gap-10 lg:grid-cols-[1fr_0.95fr] lg:items-center">
        <div class="hidden lg:block">
          <span class="inline-flex items-center gap-2 rounded-full border border-ink/10 bg-white px-3.5 py-2 text-xs font-bold uppercase tracking-[0.2em] text-forest">Start learning</span>
          <h1 class="font-display mt-6 max-w-lg text-5xl font-extrabold leading-[0.96] tracking-[-0.07em]">Create your new chapter.</h1>
          <p class="mt-5 max-w-md text-base leading-7 text-muted">Join a learning community built around real progress, practical projects, and support that keeps you moving.</p>
        </div>

        <div class="mx-auto w-full max-w-lg rounded-[2rem] border border-ink/10 bg-white p-6 shadow-soft sm:p-8">
          <div class="flex items-center justify-between gap-3">
            <div>
              <p class="text-xs font-bold uppercase tracking-[0.18em] text-forest">Sign Up</p>
              <h2 class="font-display mt-2 text-3xl font-extrabold tracking-[-0.05em]">Create account</h2>
            </div>
            <a href="/index.html" class="inline-flex h-10 w-10 items-center justify-center rounded-full bg-[#edf6df] text-lg text-forest" aria-label="Back to home">✦</a>
          </div>

          <form class="mt-7 space-y-5" data-demo-form data-success-message="Your account is ready. Welcome aboard!">
            <div class="grid gap-5 sm:grid-cols-2">
              <label class="block text-sm font-semibold text-ink">First name<input class="mt-2 block w-full rounded-2xl border border-ink/10 bg-paper px-4 py-3.5 text-sm outline-none focus:border-forest" type="text" /></label>
              <label class="block text-sm font-semibold text-ink">Last name<input class="mt-2 block w-full rounded-2xl border border-ink/10 bg-paper px-4 py-3.5 text-sm outline-none focus:border-forest" type="text" /></label>
            </div>
            <label class="block text-sm font-semibold text-ink">Email address<input class="mt-2 block w-full rounded-2xl border border-ink/10 bg-paper px-4 py-3.5 text-sm outline-none focus:border-forest" type="email" /></label>
            <label class="block text-sm font-semibold text-ink">Password<input class="mt-2 block w-full rounded-2xl border border-ink/10 bg-paper px-4 py-3.5 text-sm outline-none focus:border-forest" type="password" /></label>
            <button type="submit" class="inline-flex w-full items-center justify-center rounded-full bg-forest px-5 py-3.5 text-sm font-bold text-white transition hover:bg-ink">Create account</button>
            <p data-form-message class="min-h-4 text-sm text-forest" aria-live="polite"></p>
          </form>

          <p class="mt-6 text-center text-sm text-muted">Already have an account? <a href="/login.html" class="font-semibold text-forest hover:text-ink">Log in</a></p>
        </div>
      </div>
    </main>
  </body>
</html>
